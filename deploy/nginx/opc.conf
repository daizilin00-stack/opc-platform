# OPC 数字平台 - Nginx 生产配置
# 域名：csdp-agentwork.com
# 路径：/etc/nginx/sites-available/opc.conf
# 用法：ln -s /etc/nginx/sites-available/opc.conf /etc/nginx/sites-enabled/

upstream opc_frontend {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream opc_backend {
    server 127.0.0.1:3003;
    keepalive 32;
}

upstream opc_newapi {
    server 127.0.0.1:3004;
    keepalive 32;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name csdp-agentwork.com www.csdp-agentwork.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
        # 防止 HTML 页面被长期缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires off;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name csdp-agentwork.com www.csdp-agentwork.com;

    # SSL 证书（路径由 certbot/阿里云 SSL 提供后修改）
    ssl_certificate /etc/letsencrypt/live/csdp-agentwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csdp-agentwork.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 日志
    access_log /var/log/nginx/opc-access.log;
    error_log /var/log/nginx/opc-error.log;

    # 静态资源缓存
    location /_next/static {
        proxy_pass http://opc_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 接口
    location /api {
        proxy_pass http://opc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # NewAPI 代理
    location /v1 {
        proxy_pass http://opc_newapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # 前端主站
    location / {
        proxy_pass http://opc_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
